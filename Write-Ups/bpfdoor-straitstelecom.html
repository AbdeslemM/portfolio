function b64(s) { return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }

async function decrypt(password) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64(S), iterations: IT, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(V) }, key, b64(C));
  return new TextDecoder().decode(pt);
}

document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("go"), err = document.getElementById("err");
  err.textContent = ""; btn.disabled = true;
  try {
    const html = await decrypt(document.getElementById("pw").value);
    const out = document.getElementById("content");
    out.innerHTML = html; out.hidden = false;
    document.getElementById("gate").remove();
    out.querySelectorAll("figure.ev img").forEach(function (im) {
      im.addEventListener("click", function () {
        var o = document.createElement("div"); o.className = "lb";
        o.appendChild(im.cloneNode()); o.addEventListener("click", function () { o.remove(); });
        document.body.appendChild(o);
      });
    });
    window.scrollTo(0, 0);
  } catch (x) {
    err.textContent = "Wrong password.";
    btn.disabled = false;
  }
});
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape") { var l = document.querySelector(".lb"); if (l) l.remove(); }
});
